# boot/limine.conf
#
# Limine bootloader configuration for gehirn.system.
# This file is placed in the ISO image and read by Limine at boot time.
# It tells the bootloader where to find the kernel binary and how to load it.

# How long (in seconds) to show the boot menu before auto-booting the first entry.
# Set to 0 for instant boot — useful once the kernel is stable.
timeout: 3

# ── Boot entry ────────────────────────────────────────────────────────────────
#
# Each entry starts with a line beginning with /  — that is the display name.
# "protocol: limine" tells the bootloader to use the Limine boot protocol,
# which is what our kernel expects (the requests we declared in main.rs).
# "path: boot():/boot/gehirn-kernel" points to our kernel ELF on the boot partition.

/GEHIRN.SYSTEM — INITIALIZING
    protocol: limine
    path: boot():/boot/gehirn-kernel